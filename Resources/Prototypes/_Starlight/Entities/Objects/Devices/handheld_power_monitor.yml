- type: entity
  name: handheld power monitor
  parent: [ PowerCellSlotMediumItem, BaseHandheldComputer ] # Medium battery
  id: HandheldPowerMonitor
  description: A hand-held diagnostic slate that maps out the station's power network.
  components:
  # TODO: placeholder sprite, borrowed from the handheld mass scanner until this gets its own RSI.
  - type: Item
    sprite: Objects/Tools/handheld_mass_scanner.rsi
  - type: Sprite
    sprite: Objects/Tools/handheld_mass_scanner.rsi
    state: icon
    layers:
    - state: icon
    - state: scanner
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: BatteryVisuals
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerDeviceVisualLayers.Powered:
          Full: { visible: true }
          Neither: { visible: true }
          Empty: { visible: false }
  - type: PowerCellDraw
    drawRate: 1.5
  - type: PowerMonitoringConsole
  - type: PowerMonitoringCableNetworks
  - type: ActivatableUI
    key: enum.PowerMonitoringConsoleUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.PowerMonitoringConsoleUiKey.Key:
        type: PowerMonitoringConsoleBoundUserInterface
  - type: GuideHelp
    guides:
    - InspectingPower
    - DeviceMonitoringAndControl
  - type: StaticPrice
    price: 200

- type: entity
  id: HandheldPowerMonitorEmpty
  parent: HandheldPowerMonitor
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist:
          tags:
          - MechReactor
